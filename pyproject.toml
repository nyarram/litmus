[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litmus"
version = "0.2.0"
description = "Free, open-source evaluation and observability harness for LLM pipelines and agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]
agent = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
litmus = "litmus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/litmus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
