[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus"
version = "0.1.0"
description = "Offline regression evals for agents and LLM pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nikhil Yarram" }]
keywords = ["llm", "eval", "observability", "testing"]

[project.scripts]
litmus = "litmus.cli:main"

[tool.setuptools.packages.find]
include = ["litmus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
